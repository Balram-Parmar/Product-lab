<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sift — X post archive{% endblock %}</title>
  <meta name="description" content="Search X posts stored in PostgreSQL by text, hashtag, author, language, and date.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d5c4d'/%3E%3Cpath d='M9 22c2 1.6 4 2.4 6.4 2.4 3.1 0 5.1-1.4 5.1-3.6 0-2-1.3-3.1-4.4-4.1-4-1.3-5.8-3.1-5.8-6.1C10.3 7.4 13 5 17 5c2.3 0 4.2.6 5.7 1.7l-1.5 3.2c-1.3-.9-2.7-1.3-4.3-1.3-2.5 0-4 1.2-4 3 0 1.7 1.2 2.7 4.1 3.6 4.2 1.3 6.1 3.2 6.1 6.6 0 4.1-3 6.7-7.8 6.7-2.8 0-5.3-.8-7.4-2.4z' fill='%23f8faf8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='fonts.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="masthead">
    <div class="shell masthead-inner">
      <a class="wordmark" href="{{ url_for('index') }}" aria-label="Sift home">Sift</a>
      <p class="tagline">an X post archive</p>

      {% if stats %}
      <dl class="counts" aria-label="Archive totals">
        <div>
          <dt>posts</dt>
          <dd>{{ stats.tweets|num }}</dd>
        </div>
        <div>
          <dt>authors</dt>
          <dd>{{ stats.users|num }}</dd>
        </div>
        <div>
          <dt>runs</dt>
          <dd>{{ stats.topics|num }}</dd>
        </div>
      </dl>
      {% else %}
      <p class="counts-offline">database offline</p>
      {% endif %}
    </div>
  </header>

  <main class="shell" id="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <p>Loaded from <code>mock.json</code>, an X API v2 payload.</p>
      <p class="stack">Python 3 · PostgreSQL · Flask</p>
    </div>
  </footer>
</body>
</html>
